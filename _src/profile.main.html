<div class="profile-page">

        <div class="profile-header">
            <div class="profile-avatar">
                <i class='bx bx-user'></i>
            </div>
            <div class="profile-header-text">
                <h1 id="profile-name">My Account</h1>
                <p id="profile-email">Loading...</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs">
            <div class="profile-tab active" data-tab="orders">
                <i class='bx bx-package'></i> My Orders
            </div>
            <div class="profile-tab" data-tab="details">
                <i class='bx bx-user-circle'></i> Account Details
            </div>
            <div class="profile-tab" data-tab="security">
                <i class='bx bx-lock-alt'></i> Password & Security
            </div>
        </div>

        <!-- Orders Panel -->
        <div class="profile-panel active" id="tab-orders">
            <table class="orders-table" id="orders-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                    <!-- populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Account Details Panel -->
        <div class="profile-panel" id="tab-details">
            <div class="profile-form">
                <div class="pf-row">
                    <div class="pf-group">
                        <label>First Name</label>
                        <input type="text" id="pf-fname" placeholder="First name">
                    </div>
                    <div class="pf-group">
                        <label>Last Name</label>
                        <input type="text" id="pf-lname" placeholder="Last name">
                    </div>
                </div>
                <div class="pf-group">
                    <label>Email Address</label>
                    <input type="email" id="pf-email" placeholder="your@email.com">
                </div>
                <div class="pf-group">
                    <label>Phone Number</label>
                    <input type="tel" id="pf-phone" placeholder="+94 77 000 0000">
                </div>
                <div class="pf-group">
                    <label>Delivery Address</label>
                    <input type="text" id="pf-address" placeholder="Street, City">
                </div>
                <button class="save-btn" onclick="saveProfile()">Save Changes</button>
                <br>
                <button class="logout-btn" onclick="logout()">
                    <i class='bx bx-log-out'></i> Sign Out
                </button>
            </div>
        </div>

        <!-- Security Panel -->
        <div class="profile-panel" id="tab-security">
            <div class="profile-form">
                <div class="pf-group">
                    <label>Current Password</label>
                    <input type="password" id="sec-current" placeholder="Enter current password">
                </div>
                <div class="pf-group">
                    <label>New Password</label>
                    <input type="password" id="sec-new" placeholder="Min. 6 characters">
                </div>
                <div class="pf-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="sec-confirm" placeholder="Repeat new password">
                </div>
                <button class="save-btn" onclick="changePassword()">Update Password</button>
            </div>
        </div>

    </div>

    <!-- Footer -->
